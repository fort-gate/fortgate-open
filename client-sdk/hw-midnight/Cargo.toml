[package]
name = "fortgate-hw-midnight"
version = "0.1.0"
edition = "2021"
description = "Midnight ZK provider for Fortgate hw-trust-v1"

[dependencies]
midnight-zk-stdlib = "2.3.0"
midnight-circuits = "7.2"
midnight-curves = "0.3"
midnight-proofs = "0.8"
sha2 = "0.10"
rand = "0.8"
blake2b_simd = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
p256 = { version = "0.13", features = ["ecdsa"] }
fortgate-id-core = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
group = "0.13"

[[bin]]
name = "fortgate-hw-poc"
path = "src/bin/fortgate_hw_poc.rs"

[dev-dependencies]
tempfile = "3"
