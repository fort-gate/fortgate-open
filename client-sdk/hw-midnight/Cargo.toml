[package]
name = "fortgate-hw-midnight"
version = "0.1.0"
edition = "2021"
description = "Midnight ZK provider for Fortgate hw-trust-v1"

[dependencies]
midnight-zk-stdlib = "2.3.0"
midnight-circuits = "7.2"
midnight-curves = "0.3"
midnight-proofs = "0.8"
sha2 = "0.10"
rand = "0.8"
blake2b_simd = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
hex = "0.4"
thiserror = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
p256 = { version = "0.13", features = ["ecdsa"] }
fortgate-id-core = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
group = "0.13"

[[bin]]
name = "fortgate-hw-poc"
path = "src/bin/fortgate_hw_poc.rs"

[[bin]]
name = "fg-bench"
path = "src/bin/fg_bench.rs"

[dev-dependencies]
tempfile = "3"

# `lto = "fat"` + `codegen-units = 1` se probaron y se descartaron: no dieron mejora
# medible en el tiempo de prove (+1.6%, dentro del ruido entre corridas) y llevaron el
# build limpio de release de 41 s a 7 m 40 s. El costo de prove está dominado por las
# FFT/MSM de 2^16 dentro de midnight-proofs, que ya se compila con opt-level 3 y no se
# beneficia del inlining entre crates. Ver ADR-0001 para los números.
[profile.release]
opt-level = 3
